<!-- Benji's hats: pick what Benji wears. Some hats unlock with badges. -->
<dialog id="hatsPage" class="screen page" data-accent="settings" aria-labelledby="htTitle">
  <div class="page-body">
    <div class="page-hero hats-hero">
      <div id="htPreview" class="hats-preview" aria-hidden="true"></div>
      <h2 id="htTitle" data-t>Benji's hats</h2>
      <p id="htMeta" class="hero-meta" aria-live="polite"></p>
    </div>
    <div id="htModes" class="hat-modes" role="group" data-t-aria="How Benji picks a hat" aria-label="How Benji picks a hat"></div>
    <h3 data-t>Every season</h3>
    <ul id="htSeason" class="hat-grid"></ul>
    <h3 data-t>Earn with badges</h3>
    <p class="muted small" data-t>Earn the badge under each hat to unlock it. Tap a hat you have to put it on.</p>
    <ul id="htEarn" class="hat-grid"></ul>
  </div>
</dialog>
