<!-- Putting Benji's Kitchen on the home screen, with pictures for each step -->
<dialog id="homeScreenPage" class="screen page" data-accent="pantry" aria-labelledby="hsTitle">
  <div class="page-body">
    <div class="page-hero">
      <img class="hero-art" src="img/install/done.svg" width="120" height="156" alt="">
      <h2 id="hsTitle" data-t>Put Benji on your home screen</h2>
      <p class="hero-meta" data-t>Then Benji's Kitchen opens like any other app, with its own icon and no browser bars.</p>
    </div>
    <div id="hsInstalled" class="card hidden"><p data-t>You're all set. Benji's Kitchen is already on your home screen.</p></div>
    <button id="hsInstallBtn" class="primary wide big-add hidden" type="button" data-t>Put it on my home screen</button>
    <div class="seg" id="hsWhich" role="group" data-t-aria="Which phone?" aria-label="Which phone?">
      <button data-phone="iphone" aria-pressed="false" data-t>iPhone or iPad</button>
      <button data-phone="android" aria-pressed="false" data-t>Android</button>
    </div>
    <ol id="hsSteps" class="install-steps"></ol>
  </div>
</dialog>
