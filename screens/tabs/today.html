<!-- TODAY: the home screen, drawn as Benji's kitchen. Every part of the room is a button. -->
<section id="tab-today" class="tab active" aria-labelledby="tabbtn-today">
  <div class="kitchen scene">
    <div class="k-wall">
      <div class="k-board"><div id="todaySpecial"></div></div>
      <div class="k-corner">
        <button id="todayHatsBtn" class="k-hat" type="button" data-go-hats data-t-aria="Benji's hats" aria-label="Benji's hats">
          <span class="k-peg" aria-hidden="true"></span>
          <span id="todayHatArt" class="k-hat-art" aria-hidden="true"></span>
          <span class="k-label" data-t>Hats</span>
        </button>
        <button id="todayJar" class="k-jar" type="button"></button>
        <span class="k-shelf" aria-hidden="true"></span>
      </div>
    </div>
    <div class="k-room">
      <div id="alerts" class="today-pal k-benji"></div>
      <div id="todayFridge" class="k-fridge">
        <span class="k-freezer" aria-hidden="true"></span>
        <div class="k-door">
          <button id="todayAllFood" class="k-note" type="button"></button>
          <button id="todayCookBtn" class="k-note k-cook hidden" type="button"><span data-t>Cook these</span></button>
          <ul id="todayUseFirst" class="k-magnets"></ul>
        </div>
        <button id="todayShopBtn" class="k-flyer" type="button">
          <span class="k-flyer-awning" aria-hidden="true"></span>
          <svg class="ic" aria-hidden="true"><use href="img/icons/ui/basket.svg#i"/></svg>
          <span data-t>Benji's shop</span>
        </button>
      </div>
      <button id="todayPlayBtn" class="k-console" type="button" data-t-aria="Play a game" aria-label="Play a game">
        <span class="k-screen" aria-hidden="true"></span>
        <span class="k-keys" aria-hidden="true"><span></span><span></span></span>
        <span class="k-console-label" data-t>Play</span>
      </button>
      <span class="k-counter" aria-hidden="true"></span>
    </div>
    <div class="k-floor today-add">
      <button id="todayAddBtn" class="k-bag" type="button"><svg class="ic" aria-hidden="true"><use href="img/icons/ui/plus.svg#i"/></svg> <span data-t>Add food</span></button>
      <button id="todayTalkBtn" class="k-round hidden" type="button" data-t-aria="Say what you bought" aria-label="Say what you bought"><svg class="ic" aria-hidden="true"><use href="img/icons/ui/mic.svg#i"/></svg></button>
      <button id="todayScanBtn" class="k-round" type="button" data-t-aria="Scan a barcode" aria-label="Scan a barcode"><svg class="ic" aria-hidden="true"><use href="img/icons/ui/camera.svg#i"/></svg></button>
    </div>
  </div>
</section>
