<!-- TODAY: the home screen. Everything fits on one phone screen. -->
<section id="tab-today" class="tab active" aria-labelledby="tabbtn-today">
  <div id="alerts" class="today-pal"></div>
  <section class="today-card" aria-labelledby="useFirstTitle">
    <div class="today-card-head">
      <h2 id="useFirstTitle" data-t>Use these first</h2>
      <button id="todayAllFood" class="text-btn" type="button"></button>
      <button id="todayCookBtn" class="cook-these hidden" type="button"><svg class="ic" aria-hidden="true"><use href="img/icons/ui/chef.svg#i"/></svg> <span data-t>Cook these</span></button>
    </div>
    <ul id="todayUseFirst" class="today-rows"></ul>
  </section>
  <div id="todaySpecial"></div>
  <button id="todayJar" class="today-jar" type="button"></button>
  <div class="today-add">
    <button id="todayAddBtn" class="primary big-add" type="button"><svg class="ic" aria-hidden="true"><use href="img/icons/ui/plus.svg#i"/></svg> <span data-t>Add food</span></button>
    <button id="todayTalkBtn" class="round-tool hidden" type="button" data-t-aria="Say what you bought" aria-label="Say what you bought"><svg class="ic" aria-hidden="true"><use href="img/icons/ui/mic.svg#i"/></svg></button>
    <button id="todayScanBtn" class="round-tool" type="button" data-t-aria="Scan a barcode" aria-label="Scan a barcode"><svg class="ic" aria-hidden="true"><use href="img/icons/ui/camera.svg#i"/></svg></button>
  </div>
</section>
