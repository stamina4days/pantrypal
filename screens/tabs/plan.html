<!-- PLAN -->
<section id="tab-plan" class="tab" aria-labelledby="tabbtn-plan">
  <div class="hint-slot" data-hint="plan"></div>
  <button id="autoPlanBtn" class="primary wide big-btn"><svg class="ic" aria-hidden="true"><use href="img/icons/ui/sparkle.svg#i"/></svg> <span data-t>Plan my week</span></button>
  <button id="weekBtn" class="wide week-btn"><svg class="ic" aria-hidden="true"><use href="img/icons/ui/week.svg#i"/></svg> <span data-t>Week at a glance</span></button>
  <div class="grid2">
    <button id="planShopBtn"><svg class="ic" aria-hidden="true"><use href="img/icons/ui/cart.svg#i"/></svg> <span data-t>Shopping list</span></button>
    <button id="prepBtn"><svg class="ic" aria-hidden="true"><use href="img/icons/ui/knife.svg#i"/></svg> <span data-t>Prep day</span></button>
    <button id="planPrintBtn"><svg class="ic" aria-hidden="true"><use href="img/icons/ui/printer.svg#i"/></svg> <span data-t>Print</span></button>
    <button id="planCalBtn"><svg class="ic" aria-hidden="true"><use href="img/icons/ui/calendar.svg#i"/></svg> <span data-t>Add to calendar</span></button>
  </div>
  <p class="muted small" data-t>Food a planned meal needs is set aside, so For You won't suggest using it twice.</p>
  <div id="planBody"></div>
</section>
