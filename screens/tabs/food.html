<!-- MY FOOD -->
<section id="tab-pantry" class="tab active" aria-labelledby="tabbtn-pantry">
  <div class="hint-slot" data-hint="food"></div>
  <div id="alerts"></div>
  <div id="placeTiles" class="place-tiles" role="group" data-t-aria="Your shelves" aria-label="Your shelves"></div>
  <div class="toolbar">
    <input id="pantrySearch" class="search" type="search" data-t-ph="Search your food..." placeholder="Search your food..." data-t-aria="Search your food" aria-label="Search your food">
    <button id="quickAddBtn" class="icon-square" data-t-aria="Quick add several items" aria-label="Quick add several items">&#128221;</button>
    <button id="receiptBtn" class="icon-square" data-t-aria="Scan a grocery receipt" aria-label="Scan a grocery receipt">&#129534;</button>
    <button id="scanQuick" class="icon-square" data-t-aria="Scan a barcode" aria-label="Scan a barcode">&#128247;</button>
    <input id="receiptFile" type="file" accept="image/*" capture="environment" hidden>
  </div>
  <div class="chips" id="locFilter" role="group" data-t-aria="Filter by place" aria-label="Filter by place"></div>
  <ul id="itemList" class="list"></ul>
  <div id="emptyPantry" class="empty hidden">
    <img class="empty-img" src="img/illustrations/empty-fridge.svg" width="180" height="139" alt="">
    <p><strong data-t>Your kitchen is empty (in here, anyway).</strong></p>
    <p data-t>Tap + to add food, the notepad to add several at once, or the camera to scan a barcode. Then check Recipes for ideas that use what expires first.</p>
    <button id="emptyAuditBtn" class="primary"><span aria-hidden="true">&#9989;</span> <span data-t>Do a quick pantry audit</span></button>
  </div>
  <button id="addBtn" class="fab" data-t-aria="Add item" aria-label="Add item">+</button>
</section>
