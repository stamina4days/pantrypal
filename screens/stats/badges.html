<!-- Badges: stickers you earn for wasting less and cooking more -->
<dialog id="badgesPage" class="screen page" data-accent="stats" aria-labelledby="bgTitle">
  <div class="page-body">
    <div class="page-hero">
      <img class="hero-art" src="img/badges/saver.svg" width="110" height="110" alt="">
      <h2 id="bgTitle" data-t>Your badges</h2>
      <p id="bgMeta" class="hero-meta"></p>
    </div>
    <div id="bgStreak"></div>
    <button type="button" class="wide hats-link" data-go-hats><svg class="ic" aria-hidden="true"><use href="img/icons/ui/hat.svg#i"/></svg> <span data-t>Benji's hats</span></button>
    <ul id="bgGrid" class="badge-grid"></ul>
  </div>
</dialog>
