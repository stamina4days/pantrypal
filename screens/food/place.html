<!-- Everything on one shelf: the fridge, the freezer, the pantry, or the counter -->
<dialog id="placePage" class="screen page" data-accent="pantry" aria-labelledby="plName">
  <div class="page-body">
    <div class="page-hero place-hero">
      <img id="plArt" class="hero-art" src="img/places/fridge.svg" width="140" height="140" alt="">
      <h2 id="plName"></h2>
      <p id="plMeta" class="hero-meta"></p>
    </div>
    <div id="plStats" class="stat-chips"></div>
    <div id="plTip"></div>
    <div class="action-grid two">
      <button id="plAdd" type="button"><span aria-hidden="true">+</span> <span data-t>Add food here</span></button>
      <button id="plCheck" type="button"><svg class="ic" aria-hidden="true"><use href="img/icons/ui/check.svg#i"/></svg> <span data-t>All still good</span></button>
    </div>
    <section class="page-section">
      <h3 id="plListTitle" data-t>On this shelf</h3>
      <ul id="plList" class="list mini-list"></ul>
      <div id="plEmpty" class="empty-art hidden">
        <img src="img/illustrations/empty-fridge.svg" width="180" height="139" alt="">
        <p data-t>Nothing here yet.</p>
      </div>
    </section>
  </div>
</dialog>
