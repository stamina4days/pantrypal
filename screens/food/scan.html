<!-- Scan a barcode -->
<dialog id="scanDialog" data-accent="pantry" class="screen" aria-labelledby="scanTitle">
  <div class="dialog-body">
    <h2 id="scanTitle" data-t>Scan a barcode</h2>
    <video id="scanVideo" playsinline muted></video>
    <p id="scanStatus" class="muted small" aria-live="polite"></p>
    <form id="manualCodeForm" class="toolbar">
      <input id="manualCode" class="search" inputmode="numeric" data-t-ph="Or type the barcode number" placeholder="Or type the barcode number" data-t-aria="Barcode number" aria-label="Barcode number">
      <button type="submit" data-t>Look up</button>
    </form>
    <div class="actions"><span class="spacer"></span><button id="closeScan" data-t>Cancel</button></div>
  </div>
</dialog>
