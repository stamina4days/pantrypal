<!-- Receipt check -->
<dialog id="receiptDialog" data-art="img/badges/receipt-reader.svg" data-accent="pantry" class="screen" aria-labelledby="receiptTitle">
  <div class="dialog-body">
    <h2 id="receiptTitle" data-t>Check your receipt</h2>
    <p class="muted small" data-t>Receipts use short codes, so fix any names that look off and uncheck anything that isn't food.</p>
    <div id="receiptBody"></div>
    <div class="actions">
      <span class="spacer"></span>
      <button id="cancelReceipt" data-t>Cancel</button>
      <button id="confirmReceipt" class="primary" data-t>Add to My Food</button>
    </div>
  </div>
</dialog>
