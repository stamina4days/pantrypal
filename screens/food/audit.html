<!-- Pantry audit -->
<dialog id="auditDialog" data-art="img/illustrations/market-crate.svg" data-accent="pantry" class="screen" aria-labelledby="auditTitle">
  <div class="dialog-body">
    <h2 id="auditTitle" data-t>Pantry audit</h2>
    <p class="muted small" data-t>Tap everything you have right now. Amounts and dates are rough guesses you can fix later.</p>
    <div id="auditBody"></div>
    <form id="auditAddForm" class="toolbar">
      <input id="auditAdd" class="search" data-t-ph="Something else? e.g. 2 lbs pork chops" placeholder="Something else? e.g. 2 lbs pork chops" data-t-aria="Add something else" aria-label="Add something else">
      <button type="submit" data-t>Add</button>
    </form>
    <ul id="auditExtra" class="mini-list"></ul>
    <div class="actions">
      <button id="auditSkip" data-t>Skip for now</button>
      <span class="spacer"></span>
      <button id="auditDone" class="primary"></button>
    </div>
  </div>
</dialog>
