<!-- One food, up close: how fresh it is, what to cook with it, and how to keep it -->
<dialog id="itemPage" class="screen page" data-accent="pantry" aria-labelledby="ipName">
  <div class="page-body">
    <div class="page-hero">
      <span id="ipEmoji" class="hero-sticker" aria-hidden="true"></span>
      <h2 id="ipName"></h2>
      <p id="ipMeta" class="hero-meta"></p>
    </div>
    <div id="ipFresh" class="fresh"></div>
    <div id="ipPal"></div>
    <div id="ipActions" class="action-grid"></div>

    <section class="page-section">
      <h3 data-t>Cook it</h3>
      <ul id="ipRecipes" class="list mini-list"></ul>
      <button id="ipAllRecipes" class="wide" type="button" data-t>See every recipe that uses it</button>
    </section>

    <section class="page-section">
      <h3 data-t>How long it keeps</h3>
      <div id="ipShelf" class="shelf-row"></div>
      <div id="ipTip"></div>
    </section>

    <div id="ipRemix"></div>

    <section class="page-section">
      <h3 data-t>Details</h3>
      <dl id="ipFacts" class="facts"></dl>
    </section>
  </div>
</dialog>
