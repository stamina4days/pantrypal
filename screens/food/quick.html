<!-- Quick add -->
<dialog id="quickDialog" data-art="img/illustrations/empty-list.svg" data-accent="pantry" class="screen" aria-labelledby="quickTitle">
  <div class="dialog-body">
    <h2 id="quickTitle" data-t>Quick add</h2>
    <p class="muted small" data-t>Type or paste items, separated by commas or new lines. Amounts are optional, like "12 eggs, 2 lbs chicken, spinach".</p>
    <textarea id="quickText" rows="5" data-t-aria="Items to add" aria-label="Items to add"></textarea>
    <ul id="quickPreview" class="mini-list"></ul>
    <div class="actions">
      <span class="spacer"></span>
      <button id="cancelQuick" data-t>Cancel</button>
      <button id="confirmQuick" class="primary"></button>
    </div>
  </div>
</dialog>
