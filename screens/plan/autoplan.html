<!-- Plan my week -->
<dialog id="plannerDialog" data-art="img/illustrations/calendar.svg" data-accent="plan" class="screen" aria-labelledby="plannerTitle">
  <div class="dialog-body">
    <div class="r-head"><h2 id="plannerTitle" data-t>Plan my week</h2><button id="closePlanner" class="icon-square" data-t-aria="Close" aria-label="Close">&times;</button></div>
    <div id="plannerOpts"></div>
    <div id="plannerResult"></div>
    <div id="plannerActions" class="actions"></div>
  </div>
</dialog>
