<!-- A shelf of recipes picked around one idea: quick, kid-friendly, freezer meals, a cuisine... -->
<dialog id="collectionPage" class="screen page" data-accent="recipes" aria-labelledby="colName">
  <div class="page-body">
    <div class="page-hero collection-hero">
      <span id="colEmoji" class="hero-sticker" aria-hidden="true"></span>
      <h2 id="colName"></h2>
      <p id="colDesc" class="hero-meta"></p>
    </div>
    <div class="seg" id="colSort" role="group">
      <button data-sort="best" class="on" aria-pressed="true" data-t>Best for me</button>
      <button data-sort="time" aria-pressed="false" data-t>Quickest</button>
      <button data-sort="cost" aria-pressed="false" data-t>Cheapest</button>
    </div>
    <p id="colCount" class="muted small"></p>
    <ul id="colList" class="list mini-list"></ul>
    <button id="colMore" class="wide hidden" type="button" data-t>Show more</button>
  </div>
</dialog>
