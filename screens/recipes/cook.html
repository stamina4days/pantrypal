<!-- Cook mode -->
<dialog id="cookDialog" data-accent="cook" class="screen cook" aria-labelledby="cookTitle">
  <div class="cook-wrap">
    <div class="r-head">
      <div><h2 id="cookTitle"></h2><p id="cookProgress" class="muted small"></p></div>
      <button id="cookExit" class="icon-square" data-t-aria="Exit cook mode" aria-label="Exit cook mode">&times;</button>
    </div>
    <div class="timer-slot hidden"></div>
    <div class="hint-slot" data-hint="cook"></div>
    <p id="cookStep" class="cook-step" aria-live="polite"></p>
    <div id="cookStepTimer"></div>
    <button id="cookIngrBtn" class="link-btn" aria-expanded="false" data-t>Show ingredients</button>
    <div id="cookIngrWrap" class="hidden"><ul id="cookIngr" class="ings plain-list"></ul></div>
    <div class="cook-tools">
      <button id="cookRead" class="chip" aria-pressed="false"><span aria-hidden="true">&#128266;</span> <span data-t>Read aloud</span></button>
      <button id="cookVoice" class="chip" aria-pressed="false"><span aria-hidden="true">&#127908;</span> <span data-t>Voice commands</span></button>
    </div>
    <div class="cook-nav">
      <button id="cookPrev" data-t>Back</button>
      <button id="cookNext" class="primary" data-t>Next</button>
    </div>
  </div>
</dialog>
