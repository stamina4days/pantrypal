<!-- Diet and allergies -->
<dialog id="dietDialog" data-art="img/illustrations/no-recipes.svg" data-accent="recipes" class="screen" aria-labelledby="dietTitle">
  <div class="dialog-body">
    <h2 id="dietTitle" data-t>Diet and allergies</h2>
    <p class="muted small" data-t>Recipes that don't fit are hidden. Some recipes stay in with a simple swap (like gluten-free pasta), shown in the recipe. This is a helper, not a guarantee, so always check labels if you have an allergy.</p>
    <div id="dietOptions"></div>
    <div class="actions"><span class="spacer"></span><button id="closeDiet" class="primary" data-t>Done</button></div>
  </div>
</dialog>
