<!-- Pick a shopping list -->
<dialog id="listPickDialog" data-accent="shopping" class="sheet" aria-labelledby="listPickTitle">
  <div class="dialog-body">
    <h2 id="listPickTitle" data-t>Add to a shopping list</h2>
    <div id="shopPick"></div>
    <label class="plain"><span data-t>List</span> <select id="shopListPick"></select></label>
    <input id="shopNewName" class="search hidden" data-t-ph="New list name, e.g. Saturday groceries" placeholder="New list name, e.g. Saturday groceries" data-t-aria="New list name" aria-label="New list name">
    <div class="actions">
      <span class="spacer"></span>
      <button id="cancelPick" data-t>Cancel</button>
      <button id="confirmShop" class="primary" data-t>Add to list</button>
    </div>
  </div>
</dialog>
