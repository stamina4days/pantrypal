<script>
/* Runs first. After an update, clear the old offline copy so old and new files never mix. Bump BUILD with every release. */
(function () {
  var BUILD = "11.9.1";
  try {
    if (localStorage.getItem("pantrypal.fast")) document.documentElement.classList.add("fast");
    try { var st = JSON.parse(localStorage.getItem("pantrypal.settings.v1") || "{}"); var ts = st.textSize || (st.largeText ? "large" : ""); if (ts && ts !== "normal") document.documentElement.classList.add("text-" + ts); } catch (e2) {}
    var had = localStorage.getItem("pantrypal.build");
    if (had === BUILD) return;
    localStorage.setItem("pantrypal.build", BUILD);
    var sw = navigator.serviceWorker;
    if (!(sw && sw.controller) && had === null) return;
    window.PP_UPDATING = true;
    var jobs = [];
    if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k !== "pantrypal-data"; }).map(function (k) { return caches.delete(k); })); }));
    if (sw) jobs.push(sw.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
  } catch (e) {}
})();
</script>
